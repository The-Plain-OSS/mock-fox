<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Fox - API 개발 도구</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 flex flex-col min-h-screen">
  <!-- 상단 헤더 -->
  <header class="bg-neutral-900 border-b border-neutral-800 px-4 py-3">
    <div class="flex items-center justify-between">
      <!-- 프로젝트 정보 -->
      <div class="flex items-center gap-4">
        <div>
          <input id="projectName" class="bg-transparent text-lg font-semibold text-neutral-100 placeholder-neutral-500 border-none outline-none focus:ring-0 p-0" placeholder="프로젝트 이름" />
          <div id="projectMeta" class="text-xs text-neutral-400">엔드포인트 0개 · 업데이트 방금</div>
        </div>
      </div>

      <!-- 액션 버튼들 -->
      <div class="flex items-center gap-3">
        <button id="versionBtn" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 hover:border-neutral-600 text-neutral-300 hover:text-white text-sm font-medium transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          버전
        </button>
        <button id="newProjectBtn" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-neutral-800/50 hover:bg-neutral-700/50 border border-neutral-700 hover:border-neutral-600 text-neutral-300 hover:text-white text-sm font-medium transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
          </svg>
          새 프로젝트
          <span class="w-1.5 h-1.5 bg-blue-400 rounded-full animate-pulse"></span>
        </button>
        <button id="exportHtmlBtn" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10"></path>
          </svg>
          내보내기
        </button>
        <button id="buildBtn" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
          </svg>
          Mock 서버 빌드
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 컨텐츠 -->
  <div class="flex flex-1">
    <!-- 좌측: 엔드포인트 리스트 -->
    <aside class="w-80 bg-neutral-900 border-r border-neutral-800 flex flex-col">
      <div class="p-3 border-b border-neutral-800">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-semibold text-neutral-100">엔드포인트</h2>
          <button id="addEndpointBtn" class="flex items-center gap-1 px-2 py-1 rounded-md bg-purple-600 hover:bg-purple-700 text-white text-xs font-medium transition-colors">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
            </svg>
            추가
          </button>
        </div>

        <!-- 검색 -->
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input id="searchInput" type="search" placeholder="엔드포인트 검색..." class="w-full rounded-lg border border-neutral-700 bg-neutral-800 pl-10 pr-4 py-2 text-sm text-neutral-100 placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500 transition-all" />
        </div>
      </div>

      <!-- 엔드포인트 목록 -->
      <div class="flex-1 overflow-y-auto">
        <div id="endpointList" class="p-2">
          <!-- 엔드포인트들이 여기에 표시됩니다 -->
        </div>
      </div>
    </aside>

    <!-- 우측: 엔드포인트 편집 영역 -->
    <main class="flex-1 flex flex-col">
      <!-- 편집 탭 헤더 -->
      <div class="bg-neutral-900 border-b border-neutral-800 px-4 py-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-xs font-medium px-2 py-1 rounded bg-emerald-100 text-emerald-700" id="methodBadge">GET</span>
            <span class="font-medium text-neutral-100" id="endpointPath">/api/users</span>
          </div>
          <div class="flex items-center gap-2">
            <button id="saveBtn" class="px-3 py-1.5 rounded-lg bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium transition-colors">
              저장
            </button>
            <button id="deleteEndpointBtn" class="px-3 py-1.5 rounded-lg bg-red-600 hover:bg-red-700 text-white text-sm font-medium transition-colors">
              삭제
            </button>
          </div>
        </div>
      </div>

      <!-- 편집 폼 -->
      <div class="flex-1 overflow-y-auto p-4">
        <div class="max-w-4xl space-y-6">
          <!-- 기본 정보 -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-medium text-neutral-300 mb-2">메서드</label>
              <select id="method" class="w-full rounded-lg border border-neutral-700 bg-neutral-800 px-3 py-2 text-sm text-neutral-100 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500 transition-all">
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="PATCH">PATCH</option>
                <option value="DELETE">DELETE</option>
              </select>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-neutral-300 mb-2">엔드포인트</label>
              <input id="endpoint" class="w-full rounded-lg border border-neutral-700 bg-neutral-800 px-3 py-2 text-sm text-neutral-100 placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500 transition-all" placeholder="/api/users" />
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-neutral-300 mb-2">설명</label>
            <input id="description" class="w-full rounded-lg border border-neutral-700 bg-neutral-800 px-3 py-2 text-sm text-neutral-100 placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500 transition-all" placeholder="이 엔드포인트에 대한 설명을 입력하세요" />
          </div>

          <!-- Request 섹션 -->
          <div class="space-y-4">
            <h3 class="text-lg font-semibold text-neutral-100">Request</h3>

            <div>
              <label class="block text-sm font-medium text-neutral-300 mb-2">Query Parameters (JSON)</label>
              <textarea id="query" rows="4" class="w-full rounded-lg border border-neutral-700 bg-neutral-800 px-3 py-2 text-sm text-neutral-100 placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500 transition-all font-mono" placeholder='{ "page": 1, "limit": 10 }'></textarea>
            </div>

            <div>
              <label class="block text-sm font-medium text-neutral-300 mb-2">Headers (JSON)</label>
              <textarea id="headers" rows="4" class="w-full rounded-lg border border-neutral-700 bg-neutral-800 px-3 py-2 text-sm text-neutral-100 placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500 transition-all font-mono" placeholder='{ "Authorization": "Bearer token" }'></textarea>
            </div>

            <div>
              <label class="block text-sm font-medium text-neutral-300 mb-2">Request Body (JSON)</label>
              <textarea id="requestBody" rows="6" class="w-full rounded-lg border border-neutral-700 bg-neutral-800 px-3 py-2 text-sm text-neutral-100 placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500 transition-all font-mono" placeholder='{ "name": "John Doe", "email": "john@example.com" }'></textarea>
            </div>
          </div>

          <!-- Response 섹션 -->
          <div class="space-y-4">
            <h3 class="text-lg font-semibold text-neutral-100">Response</h3>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
              <div>
                <label class="block text-sm font-medium text-neutral-300 mb-2">Status Code</label>
                <input id="responseStatus" type="number" class="w-full rounded-lg border border-neutral-700 bg-neutral-800 px-3 py-2 text-sm text-neutral-100 placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500 transition-all" placeholder="200" />
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-neutral-300 mb-2">Response Body (JSON)</label>
              <textarea id="responseBody" rows="8" class="w-full rounded-lg border border-neutral-700 bg-neutral-800 px-3 py-2 text-sm text-neutral-100 placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-purple-500 transition-all font-mono" placeholder='{ "id": 1, "name": "John Doe", "email": "john@example.com" }'></textarea>
            </div>
          </div>

          <!-- cURL 미리보기 -->
          <div class="space-y-4">
            <h3 class="text-lg font-semibold text-neutral-100">cURL 미리보기</h3>
            <div class="relative">
              <pre id="curlPreview" class="bg-neutral-800 rounded-lg p-4 text-sm text-neutral-300 font-mono overflow-x-auto">curl -X GET "https://api.example.com/users" -H "Content-Type: application/json"</pre>
              <button id="copyCurlBtn" class="absolute top-2 right-2 px-2 py-1 rounded text-xs bg-neutral-700 hover:bg-neutral-600 text-neutral-300 transition-colors">
                복사
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 기존 모달들은 그대로 유지 -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
